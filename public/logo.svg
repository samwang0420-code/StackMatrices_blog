<!-- StackMatrices Logo - Medical/Spa Professional Style -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#07C160"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
  </defs>
  
  <!-- Shield shape - trust/medical -->
  <path d="M50 5 L90 20 L90 50 Q90 85 50 95 Q10 85 10 50 L10 20 Z" 
        fill="url(#gradient)" 
        stroke="white" 
        stroke-width="2"/>
  
  <!-- Medical cross - clean lines -->
  <rect x="42" y="25" width="16" height="50" rx="2" fill="white"/>
  <rect x="25" y="42" width="50" height="16" rx="2" fill="white"/>
  
  <!-- S letter underneath -->
  <text x="50" y="78" 
        font-family="Arial, sans-serif" 
        font-size="14" 
        font-weight="bold" 
        fill="white" 
        text-anchor="middle"
        opacity="0.9">SM</text>
</svg>
